name: Build Blender 5.3 Android - Tab S9 Ultra

on:
  workflow_dispatch:
    inputs:
      config:
        description: Blender Android feature profile
        required: true
        default: lite
        type: choice
        options:
          - lite
          - full
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-blender-53-tabs9ultra.yml"

permissions:
  contents: read

concurrency:
  group: blender-53-tabs9ultra-${{ github.event.inputs.config || 'lite' }}
  cancel-in-progress: true

env:
  SOURCE_REPO: Wanderson-Magalhaes/blender_for_android
  SOURCE_COMMIT: 76dc70df95ae32dcd15f3f86abfd82f4c5691140
  BLENDER_CONFIG: ${{ github.event.inputs.config || 'lite' }}
  BUILD_BASE: ${{ github.workspace }}/blender_build_android
  BLENDER_ANDROID_APPLICATION_ID: org.blender.blender.tabs9ultra

jobs:
  build:
    name: Build Blender 5.3 ${{ github.event.inputs.config || 'lite' }} APK
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Free runner disk space
        shell: bash
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Use GitHub runner Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          SDK=/usr/local/lib/android/sdk
          test -x "$SDK/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Install host build requirements
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang-18 ninja-build meson patchelf git-lfs \
            pkg-config autoconf automake libtool m4 bison flex yasm nasm \
            cmake curl unzip zip xz-utils patch rsync \
            libssl-dev libffi-dev libxml2-dev zlib1g-dev libbz2-dev \
            liblzma-dev libreadline-dev libsqlite3-dev uuid-dev
          git lfs install
          cmake --version
          clang-18 --version
          java -version

      - name: Install Android NDK and build tools
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "ndk;28.2.13676358"

          # The Android fork deliberately unsets ANDROID_HOME in build_apk.sh,
          # then env.sh uses $HOME/android-sdk on Linux. Point that default path
          # at the SDK provided by setup-android.
          rm -rf "$HOME/android-sdk"
          ln -s "$ANDROID_HOME" "$HOME/android-sdk"

          test -x "$HOME/android-sdk/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android31-clang"
          test -x "$HOME/android-sdk/build-tools/35.0.1/zipalign"
          test -x "$HOME/android-sdk/build-tools/35.0.1/aapt2"
          test -x "$HOME/android-sdk/build-tools/35.0.1/d8"
          test -f "$HOME/android-sdk/platforms/android-35/android.jar"

      - name: Fetch exact Blender 5.3 Android source
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf upstream
          mkdir upstream
          git -C upstream init -q
          git -C upstream remote add origin "https://github.com/${SOURCE_REPO}.git"
          GIT_LFS_SKIP_SMUDGE=1 git -C upstream fetch --depth 1 origin "$SOURCE_COMMIT"
          git -C upstream checkout --detach FETCH_HEAD

          # The GitHub mirror carries LFS pointers. The matching public LFS
          # objects are served by Blender's project server.
          git -C upstream config lfs.url \
            https://projects.blender.org/blender/blender.git/info/lfs
          git -C upstream config credential.helper \
            '!f() { echo username=; echo password=; }; f'
          git -C upstream lfs install --local
          GIT_TERMINAL_PROMPT=0 git -C upstream lfs pull

          # Native host code generators need Blender's Linux precompiled libs.
          mkdir -p upstream/lib
          GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 \
            https://projects.blender.org/blender/lib-linux_x64.git \
            upstream/lib/linux_x64
          git -C upstream/lib/linux_x64 config credential.helper \
            '!f() { echo username=; echo password=; }; f'
          git -C upstream/lib/linux_x64 lfs install --local || true
          GIT_TERMINAL_PROMPT=0 git -C upstream/lib/linux_x64 lfs pull || true

          test -d upstream/lib/linux_x64
          test -f upstream/source/blender/blenkernel/BKE_blender_version.h
          grep -q '#define BLENDER_VERSION 503' \
            upstream/source/blender/blenkernel/BKE_blender_version.h

      - name: Apply Tab S9 Ultra Android fixes
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path("upstream")

          def replace_once(path, old, new, label):
              p = root / path
              s = p.read_text(encoding="utf-8")
              if old not in s:
                  raise SystemExit(f"{label}: baseline text not found in {path}")
              p.write_text(s.replace(old, new, 1), encoding="utf-8", newline="\n")

          # 1) Stop Blender's frame loop whenever Android has paused the Activity
          # or destroyed its NativeWindow. Alpha 2 continued WM_main_loop_body()
          # after TERM_WINDOW, which can submit Vulkan work to a dead surface.
          path = "intern/ghost/intern/GHOST_AndroidMain.cc"
          p = root / path
          s = p.read_text(encoding="utf-8")

          def sub1(pattern, repl, label, flags=0):
              global s
              s2, n = re.subn(pattern, repl, s, count=1, flags=flags)
              if n != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {n}")
              s = s2

          import re

          sub1(
              r"static blender::bContext \*g_context = nullptr;\n"
              r"static bool g_blender_launched = false;\n",
              "static blender::bContext *g_context = nullptr;\n"
              "static bool g_blender_launched = false;\n"
              "static bool g_has_native_window = false;\n"
              "static bool g_paused = false;\n",
              "lifecycle globals",
          )

          sub1(
              r"(\s*)switch \(cmd\) \{\n(\s*)case APP_CMD_GAINED_FOCUS:",
              lambda m:
                  f"{m.group(1)}switch (cmd) {{\n"
                  f"{m.group(2)}case APP_CMD_START:\n"
                  f"{m.group(2)}case APP_CMD_RESUME:\n"
                  f"{m.group(2)}  g_paused = false;\n"
                  f"{m.group(2)}  break;\n\n"
                  f"{m.group(2)}case APP_CMD_PAUSE:\n"
                  f"{m.group(2)}case APP_CMD_STOP:\n"
                  f"{m.group(2)}  g_paused = true;\n"
                  f"{m.group(2)}  if (GHOST_ISystem::getSystem()) {{\n"
                  f"{m.group(2)}    android_system()->handleWindowFocus(false);\n"
                  f"{m.group(2)}  }}\n"
                  f"{m.group(2)}  break;\n\n"
                  f"{m.group(2)}case APP_CMD_GAINED_FOCUS:",
              "lifecycle command insertion",
          )

          sub1(
              r"(\s*)case APP_CMD_INIT_WINDOW:\n(\s*)if \(!g_blender_launched\) \{",
              lambda m:
                  f"{m.group(1)}case APP_CMD_INIT_WINDOW:\n"
                  f"{m.group(2)}g_has_native_window = (app != nullptr && app->window != nullptr);\n"
                  f"{m.group(2)}if (!g_blender_launched) {{",
              "INIT_WINDOW",
          )

          sub1(
              r"(\s*)case APP_CMD_TERM_WINDOW:\n(\s*)if \(GHOST_ISystem::getSystem\(\)\) \{",
              lambda m:
                  f"{m.group(1)}case APP_CMD_TERM_WINDOW:\n"
                  f"{m.group(2)}g_has_native_window = false;\n"
                  f"{m.group(2)}if (GHOST_ISystem::getSystem()) {{",
              "TERM_WINDOW",
          )

          sub1(
              r"(\s*)int timeout = g_context \? 0 : -1;",
              lambda m:
                  f"{m.group(1)}int timeout = "
                  f"(g_context && g_has_native_window && !g_paused && app->window) ? 0 : -1;",
              "frame-loop timeout",
          )

          sub1(
              r"(\s*)if \(g_context\) \{\n(\s*)timeout = 0;\n(\s*)\}",
              lambda m:
                  f"{m.group(1)}timeout = "
                  f"(g_context && g_has_native_window && !g_paused && app->window) ? 0 : -1;",
              "frame-loop timeout refresh",
          )

          sub1(
              r"(\s*)if \(g_context\) \{\n(\s*)blender::WM_main_loop_body\(g_context\);\n(\s*)\}",
              lambda m:
                  f"{m.group(1)}if (g_context && g_has_native_window && !g_paused && app->window) {{\n"
                  f"{m.group(2)}blender::WM_main_loop_body(g_context);\n"
                  f"{m.group(3)}}}",
              "frame render guard",
          )

          p.write_text(s, encoding="utf-8", newline="\n")

          # 2) S Pen: side button behaves like middle mouse so it can orbit the
          # viewport. Finger long-press remains available for right-click menus.
          path = "intern/ghost/intern/GHOST_SystemAndroid.cc"
          p = root / path
          s = p.read_text(encoding="utf-8")
          old = """  /* S Pen side button: independent right-click, in hover or contact. */
            const bool side = (AMotionEvent_getButtonState(event) &
                               AMOTION_EVENT_BUTTON_STYLUS_PRIMARY) != 0;
            if (side != stylus_button_down_) {
              stylus_button_down_ = side;
              buttons_.set(GHOST_kButtonMaskRight, side);
              pushEvent(std::make_unique<GHOST_EventButton>(
                  getMilliSeconds(),
                  side ? GHOST_kEventButtonDown : GHOST_kEventButtonUp,
                  window_,
                  GHOST_kButtonMaskRight,
                  tablet));
            }
          """
          new = """  /* S Pen side button: middle mouse, in hover or contact.
           * Blender's standard viewport navigation uses MMB for orbit, so this
           * turns the pen into a direct navigation device without changing tip
           * contact (left mouse). Finger long-press still provides right-click. */
            const bool side = (AMotionEvent_getButtonState(event) &
                               AMOTION_EVENT_BUTTON_STYLUS_PRIMARY) != 0;
            if (side != stylus_button_down_) {
              stylus_button_down_ = side;
              buttons_.set(GHOST_kButtonMaskMiddle, side);
              pushEvent(std::make_unique<GHOST_EventButton>(
                  getMilliSeconds(),
                  side ? GHOST_kEventButtonDown : GHOST_kEventButtonUp,
                  window_,
                  GHOST_kButtonMaskMiddle,
                  tablet));
            }
          """
          if old not in s:
              raise SystemExit("S Pen side-button baseline not found")
          s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8", newline="\n")

          # 3) Explicitly advertise split-screen/multi-window support and identify
          # this test line independently from the upstream S24 build.
          path = "build_files/android/apk/app/src/main/AndroidManifest.xml"
          p = root / path
          s = p.read_text(encoding="utf-8")
          s = s.replace(
              'android:versionName="5.3.0 Alpha (S24 Ultra)">',
              'android:versionName="5.3.0 Alpha 2 (Tab S9 Ultra)">',
              1,
          )
          s = s.replace('android:label="Blender"', 'android:label="Blender 5.3 Tab S9 Ultra"', 1)
          needle = 'android:launchMode="singleTask"\n'
          if needle not in s:
              raise SystemExit("manifest activity baseline not found")
          s = s.replace(needle, needle + '            android:resizeableActivity="true"\n', 1)
          p.write_text(s, encoding="utf-8", newline="\n")

          # 4) 16 KB page-size compatible APK alignment. NDK r28+ already emits
          # 16 KB-aligned ELF LOAD segments by default; this fixes the APK side.
          path = "build_files/android/apk/package.sh"
          p = root / path
          s = p.read_text(encoding="utf-8")
          old = '"$BT/zipalign" -f -p 4 "$OUT" "$STAGE/blender-aligned.apk"'
          new = '"$BT/zipalign" -f -P 16 4 "$OUT" "$STAGE/blender-aligned.apk"'
          if old not in s:
              raise SystemExit("zipalign baseline not found")
          s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8", newline="\n")

          print("Tab S9 Ultra patches applied")
          PY

          git -C upstream diff --check
          git -C upstream diff -- \
            intern/ghost/intern/GHOST_AndroidMain.cc \
            intern/ghost/intern/GHOST_SystemAndroid.cc \
            build_files/android/apk/app/src/main/AndroidManifest.xml \
            build_files/android/apk/package.sh

      - name: Restore Android dependency cache
        uses: actions/cache@v4
        with:
          path: |
            blender_build_android/lib/android_arm64
            blender_build_android/android_deps_build/downloads
            blender_build_android/android_deps_build/host
          key: blender53-${{ env.BLENDER_CONFIG }}-${{ env.SOURCE_COMMIT }}-tabs9-v1
          restore-keys: |
            blender53-${{ env.BLENDER_CONFIG }}-${{ env.SOURCE_COMMIT }}-
            blender53-lite-${{ env.SOURCE_COMMIT }}-

      - name: Build Android dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs "$BUILD_BASE"
          cd upstream

          if [ "$BLENDER_CONFIG" = "full" ]; then
            build_files/android/deps/build.sh all 2>&1 | tee ../logs/dependencies.log
          else
            # Minimal dependency closure for the 5.3 lite Android profile.
            # TBB is still needed to build OpenImageIO even though Blender's own
            # lite profile disables TBB at runtime.
            LITE_DEPS=(
              zlib zstd deflate imath fmt tbb openexr
              png pugixml jpeg brotli freetype harfbuzz webp tiff openjpeg
              expat yamlcpp blosc pystring minizipng opencolorio
              robinmap openimageio
              sqlite libffi openssl lzma bzip2 python
              xml2 eigen sse2neon fribidi vulkan_headers meshoptimizer shaderc
              certifi pip
            )

            for dep in "${LITE_DEPS[@]}"; do
              install_name="$dep"
              case "$dep" in
                vulkan_headers) install_name="vulkan" ;;
                certifi) install_name="python/lib/python3.13/site-packages/certifi" ;;
                pip) install_name="python/lib/python3.13/site-packages/pip" ;;
              esac
              if [ -d "$BUILD_BASE/lib/android_arm64/$install_name" ] &&
                 [ -n "$(ls -A "$BUILD_BASE/lib/android_arm64/$install_name" 2>/dev/null)" ]; then
                echo "[deps] $dep already cached, skipping"
              else
                build_files/android/deps/build.sh "$dep"
              fi
            done 2>&1 | tee ../logs/dependencies.log
          fi

          df -h
          du -sh "$BUILD_BASE/lib/android_arm64" || true

      - name: Build Blender 5.3 Android APK
        shell: bash
        run: |
          set -euo pipefail
          cd upstream

          # env.sh chooses clang-18 automatically and the NDK/API values are
          # pinned by the source itself. BUILD_BASE and the side-by-side app id
          # come from this workflow's environment.
          python3 build_files/android/build.py "$BLENDER_CONFIG" \
            --reconfigure --repackage --no-archive 2>&1 | tee ../logs/blender-build.log

      - name: Audit 16 KB ELF and APK compatibility
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist audit-apk

          APK="$BUILD_BASE/android_apk_stage_${BLENDER_CONFIG}/blender-${BLENDER_CONFIG}.apk"
          test -s "$APK"

          BT="$HOME/android-sdk/build-tools/35.0.1"
          NDK="$HOME/android-sdk/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin"

          "$BT/zipalign" -c -P 16 -v 4 "$APK" | tee logs/zipalign-16k.log

          rm -rf audit-apk
          mkdir audit-apk
          unzip -q "$APK" 'lib/arm64-v8a/*.so' -d audit-apk

          python3 - "$NDK/llvm-objdump" audit-apk <<'PY'
          import re
          import subprocess
          import sys
          from pathlib import Path

          objdump = sys.argv[1]
          root = Path(sys.argv[2])
          bad = []
          checked = 0

          for so in sorted(root.glob("lib/arm64-v8a/*.so")):
              out = subprocess.run(
                  [objdump, "-p", str(so)],
                  check=True,
                  text=True,
                  capture_output=True,
              ).stdout
              aligns = []
              for line in out.splitlines():
                  if "LOAD" not in line:
                      continue
                  m = re.search(r"align\s+2\*\*(\d+)", line)
                  if m:
                      aligns.append(int(m.group(1)))
              if aligns:
                  checked += 1
                  if min(aligns) < 14:
                      bad.append((so.name, min(aligns)))

          print(f"Checked ELF LOAD alignment for {checked} shared libraries")
          if bad:
              for name, power in bad:
                  print(f"UNALIGNED: {name} minimum LOAD alignment 2**{power}")
              raise SystemExit("One or more native libraries are not 16 KB ELF aligned")
          PY

          OUT="dist/Blender-5.3-Alpha2-TabS9Ultra-${BLENDER_CONFIG}.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" | tee dist/SHA256.txt
          printf '%s\n' "$SOURCE_COMMIT" > dist/SOURCE_COMMIT.txt
          git -C upstream diff > dist/TabS9Ultra-Android.patch
          ls -lh dist

      - name: Upload Blender 5.3 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Blender-5.3-TabS9Ultra-${{ env.BLENDER_CONFIG }}
          path: dist/**
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Blender-5.3-TabS9Ultra-build-logs
          path: |
            logs/**
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6

      - name: Final disk report
        if: always()
        shell: bash
        run: df -h
