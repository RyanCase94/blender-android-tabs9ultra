name: Build Blender Android - Tab S9 Ultra

on:
  workflow_dispatch:
    inputs:
      config:
        description: Blender feature profile
        required: true
        default: full
        type: choice
        options: [full, lite]

permissions:
  contents: read

concurrency:
  group: tabs9ultra-${{ github.ref }}-${{ inputs.config || 'full' }}
  cancel-in-progress: false

env:
  SOURCE_REPO: simfeo/blender
  SOURCE_COMMIT: d93bd33cba768e19ee4387a31c0ea137ee2f0047
  ANDROID_NDK_VERSION: 30.0.14904198-beta1
  BLENDER_CONFIG: ${{ inputs.config || 'full' }}
  BLENDER_ANDROID_JOBS: '3'
  GIT_TERMINAL_PROMPT: '0'

jobs:
  build:
    name: Build ${{ inputs.config || 'full' }} with Turnip and S Pen orbit
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Prepare runner and host tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs dist
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/lib/android/sdk/ndk /usr/local/lib/android/sdk/system-images
          sudo apt-get update
          sudo apt-get install -y build-essential clang-18 ninja-build patchelf git-lfs \
            pkg-config cmake curl unzip zip xz-utils python3-pip python3-venv bison flex
          chmod +x scripts/tool-wrappers/ninja
          echo "$GITHUB_WORKSPACE/scripts/tool-wrappers" >> "$GITHUB_PATH"
          git config --global credential.https://projects.blender.org.helper \
            '!f() { echo username=; echo password=; }; f'
          git lfs install
          df -h

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install matching Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          SDK=/usr/local/lib/android/sdk
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          { yes || true; } | "$SDKMANAGER" --licenses > logs/android-licenses.log
          "$SDKMANAGER" --channel=3 "ndk;$ANDROID_NDK_VERSION" \
            "platform-tools" "platforms;android-35" "build-tools;35.0.1"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          test -x "$SDK/ndk/$ANDROID_NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"

      - name: Fetch pinned source and dependency submodules
        shell: bash
        run: |
          set -euo pipefail
          mkdir upstream
          git -C upstream init -q
          git -C upstream remote add origin "https://github.com/$SOURCE_REPO.git"
          GIT_LFS_SKIP_SMUDGE=1 git -C upstream fetch --depth 1 origin "$SOURCE_COMMIT"
          GIT_LFS_SKIP_SMUDGE=1 git -C upstream checkout --detach FETCH_HEAD
          test "$(git -C upstream rev-parse HEAD)" = "$SOURCE_COMMIT"
          git -C upstream config lfs.url https://projects.blender.org/blender/blender.git/info/lfs
          git -C upstream lfs install --local
          git -C upstream lfs pull
          GIT_LFS_SKIP_SMUDGE=1 git -C upstream \
            -c submodule.lib/linux_x64.update=checkout \
            -c submodule.lib/android_arm64.update=checkout \
            submodule update --init --depth 1 lib/linux_x64 lib/android_arm64
          for lib in linux_x64 android_arm64; do
            git -C "upstream/lib/$lib" lfs install --local
            git -C "upstream/lib/$lib" lfs pull
            git -C "upstream/lib/$lib" lfs fsck
          done
          git -C upstream lfs fsck
          git -C upstream submodule status > dist/DEPENDENCY_COMMITS.txt
          find upstream/build_files/android -name '*.sh' -exec chmod +x {} +
          df -h

      - name: Supply Vulkan headers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p blender_build_android/lib/vulkan_headers
          curl --fail --location --retry 3 \
            https://github.com/KhronosGroup/Vulkan-Headers/archive/refs/tags/v1.4.341.tar.gz \
            -o "$RUNNER_TEMP/vulkan-headers.tar.gz"
          tar -xzf "$RUNNER_TEMP/vulkan-headers.tar.gz" -C "$RUNNER_TEMP"
          cp -R "$RUNNER_TEMP/Vulkan-Headers-1.4.341/include" blender_build_android/lib/vulkan_headers/

      - name: Apply tablet changes and verify Java
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_tablet_patches.py upstream --version-code "$GITHUB_RUN_NUMBER"
          git -C upstream diff --check
          bash -n upstream/build_files/android/build_apk.sh
          bash -n upstream/build_files/android/apk/package.sh
          mkdir -p "$RUNNER_TEMP/java-check"
          javac -classpath "$ANDROID_HOME/platforms/android-35/android.jar" -source 17 -target 17 \
            -d "$RUNNER_TEMP/java-check" \
            upstream/build_files/android/apk/app/src/main/java/org/blender/blender/BlenderActivity.java
          git -C upstream diff > dist/TabS9Ultra-Android.patch
          echo "$SOURCE_COMMIT" > dist/SOURCE_COMMIT.txt
          echo "$GITHUB_SHA" > dist/BUILD_RECIPE_COMMIT.txt

      - name: Build Blender with bundled Turnip driver
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          python3 -u build_files/android/build.py "$BLENDER_CONFIG" --turnip --debuggable \
            2>&1 | tee ../logs/blender-build.log

      - name: Verify the produced APK
        shell: bash
        run: |
          set -euo pipefail
          APK="blender_build_android/android_apk_stage_${BLENDER_CONFIG}-turnip/blender-${BLENDER_CONFIG}-turnip.apk"
          test -s "$APK"
          BT="$ANDROID_HOME/build-tools/35.0.1"
          "$BT/apksigner" verify --verbose --print-certs "$APK" > logs/apk-signature.txt
          "$BT/zipalign" -c -P 16 4 "$APK" | tee logs/zipalign.txt
          python3 scripts/audit_apk.py "$APK" | tee logs/elf-audit.txt
          "$BT/aapt" dump badging "$APK" > logs/apk-manifest.txt
          grep -q "package: name='org.blender.blender.tabs9ultra'" logs/apk-manifest.txt
          unzip -l "$APK" | grep 'libvulkan_turnip.so'
          OUT="dist/Blender-TabS9Ultra-${BLENDER_CONFIG}-turnip-build${GITHUB_RUN_NUMBER}.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > dist/SHA256.txt
          cp README.md dist/BUILD_NOTES.md

      - name: Upload tablet APK and source provenance
        uses: actions/upload-artifact@v4
        with:
          name: Blender-TabS9Ultra-${{ env.BLENDER_CONFIG }}-Turnip
          path: dist/**
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Blender-TabS9Ultra-build-diagnostics
          path: |
            logs/**
            dist/*.txt
            dist/*.patch
          if-no-files-found: warn
          retention-days: 14
