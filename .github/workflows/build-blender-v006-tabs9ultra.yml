name: Build Blender Android v0.0.6 Tab S9 Ultra

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-blender-v006-tabs9ultra.yml"

permissions:
  contents: read

concurrency:
  group: blender-android-v006-tabs9ultra
  cancel-in-progress: true

jobs:
  build:
    name: Build installable APK
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
      BLENDER_HOST_TOOLS: ${{ github.workspace }}/work/host-tools

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          df -h

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android and Linux build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential git gettext libpng-dev zlib1g-dev file
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager             "platforms;android-30"             "build-tools;30.0.3"             "ndk;21.4.7075529"             "cmake;3.10.2.4988404"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            .gradle/caches
            .gradle/wrapper
          key: blender-android-v006-${{ runner.os }}-${{ runner.arch }}

      - name: Unpack embedded v0.0.6 tools
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/work/tools"
          printf '%s' '' | base64 -d | tar -xz -C "$GITHUB_WORKSPACE/work/tools"
          chmod +x "$GITHUB_WORKSPACE/work/tools/"*.sh
          python3 -m py_compile "$GITHUB_WORKSPACE/work/tools/"*.py

      - name: Fetch exact v0.0.5 source set
        run: |
          set -euo pipefail
          DEST="$GITHUB_WORKSPACE/work/source"
          mkdir -p "$DEST"
          cd "$DEST"
          fetch_exact() {
            local name="$1" repo="$2" commit="$3"
            echo "::group::Fetch $name @ $commit"
            rm -rf "$name"; mkdir -p "$name"
            git -C "$name" init -q
            git -C "$name" remote add origin "https://github.com/$repo.git"
            git -C "$name" fetch -q --depth 1 origin "$commit"
            git -C "$name" checkout -q --detach FETCH_HEAD
            rm -rf "$name/.git"
            echo "::endgroup::"
          }
          fetch_exact APP-android_arm64 dshawshank/APP-android_arm64 1ebb8f4fafd55bd9e6b75e9c7dc1c9af0388c260
          fetch_exact Blender-android_arm64 dshawshank/Blender-android_arm64 61bcb6becd2272a705f0b9d4f4c9321d57d8c2f8
          fetch_exact Utilities-android_arm64 dshawshank/Utilities-android_arm64 0fd5957a7b814ed7623749962fb62f77eab02dd4
          fetch_exact lib-android_arm64 dshawshank/lib-android_arm64 ef017133815685174c2470d29f19ea7c9ce8b8e2

      - name: Apply and verify Tab S9 Ultra v0.0.6 patch
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/work/tools/apply_patch.py" "$GITHUB_WORKSPACE/work/source"
          python3 "$GITHUB_WORKSPACE/work/tools/verify_patch.py" "$GITHUB_WORKSPACE/work/source"

      - name: Build Linux host helper tools
        run: |
          bash "$GITHUB_WORKSPACE/work/tools/build_host_tools.sh"             "$GITHUB_WORKSPACE/work/source" "$BLENDER_HOST_TOOLS"

      - name: Prepare legacy Android project for CI
        run: |
          python3 "$GITHUB_WORKSPACE/work/tools/prepare_cloud_source.py"             "$GITHUB_WORKSPACE/work/source" "$BLENDER_HOST_TOOLS"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'             | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true

      - name: Multi-stage Blender Android build
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          cores: 2
          ram-size: 4096M
          heap-size: 1024M
          force-avd-creation: true
          emulator-options: >-
            -no-snapshot-load -no-snapshot-save -no-window
            -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none
          disable-animations: true
          script: bash "$GITHUB_WORKSPACE/work/tools/run_multistage_build.sh"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Blender-Android-v0.0.6-TabS9Ultra-APK
          path: |
            dist/Blender-Android-v0.0.6-TabS9-debug.apk
            dist/SHA256.txt
          retention-days: 14
          compression-level: 0

      - name: Upload failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Blender-Android-v0.0.6-build-logs
          path: |
            logs/**
            dist/**
          if-no-files-found: warn
          retention-days: 14
